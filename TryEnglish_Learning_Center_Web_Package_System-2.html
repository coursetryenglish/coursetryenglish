<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TryEnglish Learning Center</title><style>
:root{--m:#963448;--bg:#f8efea;--cream:#fff8f2;--line:#eaded8;--ink:#292322;--muted:#756966}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px system-ui;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:240px;background:linear-gradient(#fff8f4,#f9ece7);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh}.logo{padding:4px 10px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}.logo b{font-size:22px;color:var(--m);letter-spacing:.04em}.tag{display:block;color:var(--muted);font-style:italic;font-size:12px;margin-top:4px}.menu{display:grid;gap:5px}.menu button{border:0;background:transparent;text-align:left;padding:12px;border-radius:11px;color:#514744;font-weight:700}.menu button.active,.menu button:hover{background:var(--m);color:#fff}.note{margin-top:25px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;text-align:center;color:var(--m);font-family:cursive;font-size:18px}.main{flex:1;min-width:0}.top{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 26px;position:sticky;top:0;z-index:5}.nav{display:flex;gap:7px}.nav button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 15px}.nav .active{background:var(--m);color:#fff;border-color:var(--m)}.admin{font-weight:800}.avatar{display:inline-grid;place-items:center;width:36px;height:36px;background:var(--m);color:#fff;border-radius:50%;margin-right:7px}main{max-width:1450px;margin:auto;padding:24px}.hero{background:linear-gradient(110deg,var(--cream),#fff);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;justify-content:space-between;gap:15px;margin-bottom:16px}.hero h1{margin:0 0 7px;font-size:29px}.hero p{margin:0;color:var(--muted)}.date{border:1px solid var(--line);border-radius:15px;padding:13px 17px;background:#fff;min-width:210px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:16px}.stat{border:1px solid var(--line);border-radius:17px;padding:15px;background:#fff;display:flex;justify-content:space-between}.stat:nth-child(1){background:#fff0ef}.stat:nth-child(2){background:#fff4e9}.stat:nth-child(3){background:#eff8f5}.stat:nth-child(4){background:#f4f0fb}.stat strong{font-size:25px;color:var(--m)}.stat small{display:block;color:var(--muted)}.edit{border:0;background:transparent;font-size:18px;color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:21px;padding:17px;margin-bottom:15px}.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.ph h2{font-size:19px;margin:0}.ph p{font-size:12px;color:var(--muted);margin:3px 0}.primary,.danger,.ghost{border-radius:10px;padding:9px 12px;font-weight:800}.primary{background:var(--m);color:#fff;border:0}.danger{background:#fff0ef;color:#a33a48;border:0}.ghost{background:#fff;color:var(--m);border:1px solid var(--line)}.wrap{overflow:auto}.table{width:100%;min-width:780px;border-collapse:separate;border-spacing:0 6px}.table th{text-align:left;font-size:12px;color:var(--muted);padding:0 8px}.table td{padding:6px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.table td:first-child{border-left:1px solid var(--line);border-radius:9px 0 0 9px}.table td:last-child{border-right:1px solid var(--line);border-radius:0 9px 9px 0}.table input,.table select,.table textarea{width:100%;border:1px solid #ded0ca;border-radius:8px;padding:8px;background:#fff}.actions{display:flex;gap:5px}.footer{display:flex;justify-content:space-between;padding:7px 4px 30px;color:var(--muted)}.hand{font-family:cursive;color:var(--m)}.modal{position:fixed;inset:0;background:#2b252288;display:grid;place-items:center;padding:18px;z-index:20}.hidden{display:none}.box{background:#fff;border-radius:20px;padding:20px;width:min(600px,100%);max-height:90vh;overflow:auto}.mh{display:flex;justify-content:space-between}.close{border:0;background:#f4e9e5;border-radius:9px;padding:8px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #ded0ca;border-radius:9px}.full{grid-column:1/-1}@media(max-width:900px){.side{width:205px}.stats{grid-template-columns:1fr 1fr}.hero{flex-direction:column}.date{width:100%}}@media(max-width:700px){.side{display:none}.top{padding:0 14px}.nav{display:none}main{padding:14px}.fg{grid-template-columns:1fr}.full{grid-column:auto}.footer{flex-direction:column;gap:8px}}
</style></head><body><div class="app"><aside class="side"><div class="logo"><b>TRYENGLISH</b><span class="tag" id="tag">Learn and Build your confidence ✎</span></div><div class="menu"><button data-v="dashboard" class="active">▣ &nbsp; Dashboard</button><button data-v="students">👥 &nbsp; Students</button><button data-v="teachers">👤 &nbsp; Teachers</button><button data-v="schedule">▣ &nbsp; Classes / Schedule</button><button data-v="packages">📦 &nbsp; Packages</button><button data-v="questions">▤ &nbsp; Questions / Games</button><button data-v="announcements">📣 &nbsp; Announcements</button><button data-v="settings">⚙ &nbsp; Settings</button></div><div class="note">♡<br>Small Steps<br>Make Big Progress<br>♡</div></aside><section class="main"><header class="top"><div class="nav"><button>Home</button><button>Practice</button><button>Student</button><button class="active">Admin</button></div><div class="admin"><span class="avatar">A</span>Admin⌄</div></header><main id="root"></main></section></div><div id="modal" class="modal hidden"><div class="box" id="box"></div></div><script>
const K='tryenglish__web';const seed={tag:'Learn and Build your confidence',stats:{students:87,teachers:12,classes:15,questions:150},students:[['Zahra','Second Starter','Mrs. Lina','0812345678'],['Ken','First Starter','Mrs. Rani','0812987654'],['Alya','Pre Starter','Mrs. Sinta','0812678901']],teachers:[['Ms. Iga','Math','0812345678','iga@tryenglish.com'],['Ms. Tryas','Public Speaking','0812987654','tryas@tryenglish.com'],['Ms. Isna','Math','0812678901','isna@tryenglish.com']],schedules:[['Monday','15.30 - 17.00','English','Second Starter','Ms. Iga','Room 1'],['Wednesday','18.00 - 19.30','Math','Grade 3','Ms. Isna','Room 2']],questions:[['Vocabulary','Easy','Which word means “besar”?','A','B','C','B'],['Grammar','Easy','She ___ to school every day.','go','goes','going','B'],['Reading','Medium','Rina has a blue bag. What color is her bag?','Red','Blue','Green','B']],ann:[['Welcome to TryEnglish','Jangan lupa membawa buku untuk kelas besok ya! ♡']],packages:[['Zahra','Integrated Academic','12','8','01 Oct 2026','30 Oct 2026','Active'],['Ken','Integrated Academic','12','10','05 Oct 2026','03 Nov 2026','Active'],['Alya','Public Speaking','8','6','01 Oct 2026','30 Oct 2026','Active']]};let d=JSON.parse(localStorage.getItem(K)||'null')||seed;if(!d.packages)d.packages=seed.packages;let view='dashboard';const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function save(){localStorage.setItem(K,JSON.stringify(d))}function render(){d.tag&&($('#tag').textContent=d.tag+' ✎');document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===view));({dashboard,students,teachers,schedule,packages,questions,announcements,settings}[view])()}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});function modal(html){$('#box').innerHTML=html;$('#modal').classList.remove('hidden');$('#close').onclick=()=>$('#modal').classList.add('hidden')}$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.add('hidden')};function stat(k,l){return `<div class="stat"><div><strong>${d.stats[k]}</strong><small>${l}</small></div><button class="edit" data-stat="${k}">✎</button></div>`}function hero(){return `<section class="hero"><div><h1>👋 Welcome, Admin!</h1><p>Kelola semua data TryEnglish di sini. Semua informasi bisa ditambah, diedit, dan dihapus.</p></div><div class="date"><b>📅 Tuesday, 23 Sep 2026</b><br><small>20:15 WIB</small><br><span class="hand">Make It Happen ♡</span></div></section>`}function btnAdd(id,label){return `<button class="primary" id="${id}">+ ${label}</button>`}function panel(title,sub,content,addid,addlabel){return `<section class="panel"><div class="ph"><div><h2>${title}</h2><p>${sub}</p></div>${btnAdd(addid,addlabel)}</div>${content}</section>`}
function studentTable(){return `<div class="wrap"><table class="table"><tr><th>No</th><th>Name</th><th>Level</th><th>Parent</th><th>Phone</th><th>Action</th></tr>${d.students.map((s,i)=>`<tr><td>${i+1}</td><td><input data-s="${i}" data-f="0" value="${esc(s[0])}"></td><td><select data-s="${i}" data-f="1">${['Pre Starter','First Starter','Second Starter','First Mover','Second Mover','Explorer'].map(x=>`<option ${x===s[1]?'selected':''}>${x}</option>`).join('')}</select></td><td><input data-s="${i}" data-f="2" value="${esc(s[2])}"></td><td><input data-s="${i}" data-f="3" value="${esc(s[3])}"></td><td><div class="actions"><button class="primary saveS" data-i="${i}">Save</button><button class="danger delS" data-i="${i}">Delete</button></div></td></tr>`).join('')}</table></div>`}function teacherTable(){return `<div class="wrap"><table class="table"><tr><th>No</th><th>Name</th><th>Subject</th><th>Phone</th><th>Email</th><th>Action</th></tr>${d.teachers.map((t,i)=>`<tr><td>${i+1}</td><td><input data-t="${i}" data-f="0" value="${esc(t[0])}"></td><td><select data-t="${i}" data-f="1">${['English','Math','Science','Public Speaking','Cambridge'].map(x=>`<option ${x===t[1]?'selected':''}>${x}</option>`).join('')}</select></td><td><input data-t="${i}" data-f="2" value="${esc(t[2])}"></td><td><input data-t="${i}" data-f="3" value="${esc(t[3])}"></td><td><div class="actions"><button class="primary saveT" data-i="${i}">Save</button><button class="danger delT" data-i="${i}">Delete</button></div></td></tr>`).join('')}</table></div>`}function schedTable(){return `<div class="wrap"><table class="table"><tr><th>No</th><th>Day</th><th>Time</th><th>Subject</th><th>Level</th><th>Teacher</th><th>Room</th><th>Action</th></tr>${d.schedules.map((s,i)=>`<tr><td>${i+1}</td>${s.map((v,j)=>`<td><input data-c="${i}" data-f="${j}" value="${esc(v)}"></td>`).join('')}<td><div class="actions"><button class="primary saveC" data-i="${i}">Save</button><button class="danger delC" data-i="${i}">Delete</button></div></td></tr>`).join('')}</table></div>`}function qTable(){return `<div class="wrap"><table class="table"><tr><th>No</th><th>Category</th><th>Level</th><th>Question</th><th>Correct</th><th>Action</th></tr>${d.questions.map((q,i)=>`<tr><td>${i+1}</td>${q.map((v,j)=>`<td><input data-q="${i}" data-f="${j}" value="${esc(v)}"></td>`).join('')}<td><div class="actions"><button class="primary saveQ" data-i="${i}">Save</button><button class="danger delQ" data-i="${i}">Delete</button></div></td></tr>`).join('')}</table></div>`}

function packageTable(){
return `<div class="wrap"><table class="table">
<tr><th>No</th><th>Student</th><th>Program</th><th>Total</th><th>Remaining</th><th>Started</th><th>Valid Until</th><th>Status</th><th>Action</th></tr>
${d.packages.map((p,i)=>{
  const total=+p[2]||0, rem=+p[3]||0, used=Math.max(0,total-rem), pct=total?Math.round(used/total*100):0;
  return `<tr>
  <td>${i+1}</td>
  <td><input data-p="${i}" data-f="0" value="${esc(p[0])}"></td>
  <td><select data-p="${i}" data-f="1">${['Integrated Academic','Public Speaking','Olympiad','Private General','Private English'].map(x=>`<option ${x===p[1]?'selected':''}>${x}</option>`).join('')}</select></td>
  <td><input data-p="${i}" data-f="2" type="number" min="0" value="${esc(p[2])}"></td>
  <td><input data-p="${i}" data-f="3" type="number" min="0" value="${esc(p[3])}"></td>
  <td><input data-p="${i}" data-f="4" value="${esc(p[4])}"></td>
  <td><input data-p="${i}" data-f="5" value="${esc(p[5])}"></td>
  <td><select data-p="${i}" data-f="6">${['Active','Expired','Completed'].map(x=>`<option ${x===p[6]?'selected':''}>${x}</option>`).join('')}</select></td>
  <td><div class="actions"><button class="primary useP" data-i="${i}">Use 1</button><button class="primary saveP" data-i="${i}">Save</button><button class="danger delP" data-i="${i}">Delete</button></div>
  <small style="color:var(--muted)">${used}/${total} used • ${pct}%</small></td>
  </tr>`
}).join('')}</table></div>`
}
function packages(){
  const active=d.packages.filter(p=>p[6]==='Active');
  const remaining=active.reduce((n,p)=>n+(+p[3]||0),0);
  root.innerHTML=hero()+`<section class="stats">
    <div class="stat"><div><strong>${d.packages.length}</strong><small>Total Packages</small></div></div>
    <div class="stat"><div><strong>${active.length}</strong><small>Active Packages</small></div></div>
    <div class="stat"><div><strong>${remaining}</strong><small>Meetings Remaining</small></div></div>
    <div class="stat"><div><strong>30</strong><small>Default Validity (days)</small></div></div>
  </section>
  ${panel('Package Management','Track package validity, remaining meetings, attendance and rescheduling.', ' <div class="note" style="margin:0 0 12px;text-align:left;font-family:system-ui;font-size:14px;color:#5f5852"><b>Policy:</b> Absent without prior notice = meeting counted. Confirmed absence at least 1 hour before class = eligible for reschedule, subject to availability. Package expires on the Valid Until date.</div>'+packageTable(),'addP','Add Package')}`;
  bindPackages();
}
function bindPackages(){
  document.querySelectorAll('.saveP').forEach(b=>b.onclick=()=>savePackage(+b.dataset.i));
  document.querySelectorAll('.useP').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, p=d.packages[i];
    if((+p[3]||0)>0){p[3]=String((+p[3])-1); if(+p[3]===0)p[6]='Completed'; save(); render();}
    else alert('No meetings remaining.');
  });
  document.querySelectorAll('.delP').forEach(b=>b.onclick=()=>{
    if(confirm('Delete this package?')){d.packages.splice(+b.dataset.i,1);save();render();}
  });
  const b=$('#addP'); if(b)b.onclick=()=>addPackage();
}
function savePackage(i){
  const p=d.packages[i];
  document.querySelectorAll(`[data-p="${i}"]`).forEach(e=>p[+e.dataset.f]=e.value);
  save(); render();
}
function addPackage(){
  modal(`<div class="mh"><h2>Add Package</h2><button class="close" id="close">✕</button></div>
  <form id="pform"><div class="fg">
  <div class="field"><label>Student</label><input name="student" required></div>
  <div class="field"><label>Program</label><select name="program"><option>Integrated Academic</option><option>Public Speaking</option><option>Olympiad</option><option>Private General</option><option>Private English</option></select></div>
  <div class="field"><label>Total Meetings</label><input name="total" type="number" value="12" min="1" required></div>
  <div class="field"><label>Meetings Remaining</label><input name="remaining" type="number" value="12" min="0" required></div>
  <div class="field"><label>Start Date</label><input name="start" placeholder="01 Oct 2026" required></div>
  <div class="field"><label>Valid Until</label><input name="until" placeholder="30 Oct 2026" required></div>
  </div><button class="primary">Add Package</button></form>`);
  $('#pform').onsubmit=e=>{
    e.preventDefault(); const f=new FormData(e.target);
    d.packages.push([f.get('student'),f.get('program'),f.get('total'),f.get('remaining'),f.get('start'),f.get('until'),'Active']);
    save(); $('#modal').classList.add('hidden'); render();
  }
}

function dashboard(){root.innerHTML=hero()+`<section class="stats">${stat('students','Students')}${stat('teachers','Teachers')}${stat('classes','Classes / Schedules')}${stat('questions','Questions / Games')}<div class="stat"><div><strong>${d.packages.length}</strong><small>Packages</small></div></div></section>${panel('Students','Kelola data siswa.',studentTable(),'addS','Add Student')}${panel('Teachers','Kelola data guru.',teacherTable(),'addT','Add Teacher')}${panel('Classes / Schedule','Kelola jadwal kelas.',schedTable(),'addC','Add Class')}${panel('Packages','Pantau paket belajar, meeting tersisa, dan masa berlaku.',packageTable(),'addP','Add Package')}${panel('Questions / Games','Kelola soal dan games.',qTable(),'addQ','Add Question')}<div class="footer"><span class="hand">♡  Everything for a Better TryEnglish ♡</span><b>TRYENGLISH<br><small>${esc(d.tag)}</small></b></div>`;bind()}function students(){root.innerHTML=hero()+panel('Students','Semua data siswa .',studentTable(),'addS','Add Student');bind()}function teachers(){root.innerHTML=hero()+panel('Teachers','Semua data guru .',teacherTable(),'addT','Add Teacher');bind()}function schedule(){root.innerHTML=hero()+panel('Classes / Schedule','Jadwal kelas dan guru .',schedTable(),'addC','Add Class');bind()}function questions(){root.innerHTML=hero()+panel('Questions / Games','Question bank .',qTable(),'addQ','Add Question');bind()}function announcements(){root.innerHTML=hero()+panel('Announcements','Pengumuman .',`<div>${d.ann.map((a,i)=>`<div class="panel"><input data-a="${i}" data-f="0" value="${esc(a[0])}"><textarea data-a="${i}" data-f="1" style="margin-top:7px">${esc(a[1])}</textarea><div class="actions" style="margin-top:7px"><button class="primary saveA" data-i="${i}">Save</button><button class="danger delA" data-i="${i}">Delete</button></div></div>`).join('')}</div>`,'addA','Add Announcement');bind()}function settings(){root.innerHTML=hero()+`<section class="panel"><h2>Branding</h2><div class="fg"><div class="field"><label>Brand Name</label><input id="brand" value="TRYENGLISH"></div><div class="field"><label>Tagline</label><input id="tg" value="${esc(d.tag)}"></div></div><button class="primary" id="saveBrand">Save Branding</button></section>`;$('#saveBrand').onclick=()=>{d.tag=$('#tg').value||'Learn and Build your confidence';save();render()}}function bind(){document.querySelectorAll('[data-stat]').forEach(b=>b.onclick=()=>{let k=b.dataset.stat;modal(`<div class="mh"><h2>Edit ${k}</h2><button class="close" id="close">✕</button></div><div class="field" style="margin:15px 0"><label>Value</label><input id="sv" type="number" min="0" value="${d.stats[k]}"></div><button class="primary" id="ss">Save</button>`);$('#ss').onclick=()=>{d.stats[k]=Math.max(0,+$('#sv').value||0);save();$('#modal').classList.add('hidden');render()}});['S','T','C','Q','A'].forEach(x=>document.querySelectorAll('.save'+x).forEach(b=>b.onclick=()=>saveRow(x,+b.dataset.i)));['S','T','C','Q','A'].forEach(x=>document.querySelectorAll('.del'+x).forEach(b=>b.onclick=()=>{if(confirm('Delete this item?')){let m={S:'students',T:'teachers',C:'schedules',Q:'questions',A:'ann'}[x];d[m].splice(+b.dataset.i,1);save();render()}}));[['addS','student'],['addT','teacher'],['addC','class'],['addQ','question'],['addA','ann']].forEach(([id,t])=>{let b=$('#'+id);if(b)b.onclick=()=>add(t)})}function saveRow(x,i){let m={S:'students',T:'teachers',C:'schedules',Q:'questions',A:'ann'}[x],p=d[m][i],sel=x==='S'?'s':x==='T'?'t':x==='C'?'c':x==='Q'?'q':'a';document.querySelectorAll(`[data-${sel}="${i}"]`).forEach(e=>p[+e.dataset.f]=e.value);save();render()}function add(type){let fields={student:['Name','Level','Parent Name','Phone'],teacher:['Name','Subject','Phone','Email'],class:['Day','Time','Subject','Level','Teacher','Room'],question:['Category','Level','Question','A','B','C','Correct'],ann:['Title','Text']}[type];modal(`<div class="mh"><h2>Add ${type}</h2><button class="close" id="close">✕</button></div><form id="form"><div class="fg">${fields.map((f,i)=>`<div class="field ${f==='Question'||f==='Text'?'full':''}"><label>${f}</label>${f==='Text'||f==='Question'?`<textarea name="f${i}" required></textarea>`:`<input name="f${i}" required>`}</div>`).join('')}</div><button class="primary">Add</button></form>`);$('#form').onsubmit=e=>{e.preventDefault();let a=fields.map((_,i)=>new FormData(e.target).get('f'+i));let m={student:'students',teacher:'teachers',class:'schedules',question:'questions',ann:'ann'}[type];d[m].push(a);save();$('#modal').classList.add('hidden');render()}}render();
</script></body></html>
